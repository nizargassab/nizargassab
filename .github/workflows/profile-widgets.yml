name: Refresh public profile widgets
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-widgets.yml
permissions:
  contents: write
concurrency:
  group: profile-widgets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Render profile widgets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Save refreshed widgets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public GitHub profile statistics'
            git push
          fi
